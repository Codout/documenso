name: Codout Sign — build & publish

# Codout-fork-specific pipeline. Builds the branded Docker image and pushes
# it to ghcr.io/codout/documenso-codout. Designed to coexist with the
# upstream `publish.yml` (which targets DockerHub + GHCR under the
# `documenso/` namespace and is gated on the `release` branch).
#
# - Triggered by tags matching `codout-v*` (e.g. `codout-v1.0.0`),
#   pushes to `main`, and manual dispatch.
# - Runs the same lint + typecheck quality gates as upstream CI before
#   producing a release-tagged image.
# - The Codout brand flag (`NEXT_PUBLIC_CODOUT_BRANDED_BUILD=true`) is
#   passed at build time so the brand constants resolve correctly during
#   SSR.
# - No deploy secrets, signing certificates, or connection strings are
#   baked in. The runtime image still requires the env vars described
#   in DEPLOY_AZURE.md.

on:
  push:
    branches: [main]
    tags: ['codout-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag override (e.g. codout-v1.0.0). Leave empty to use the current ref.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/codout/documenso-codout

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.eslint.json

  build_and_publish:
    name: Build & publish image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute image tags
        id: tags
        run: |
          GIT_SHA="$(git rev-parse --short=12 HEAD)"
          REF_TAG=""

          if [[ "${GITHUB_REF}" == refs/tags/codout-v* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            REF_TAG="${{ inputs.tag }}"
          fi

          {
            echo "git_sha=$GIT_SHA"
            echo "ref_tag=$REF_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_CODOUT_BRANDED_BUILD=true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.git_sha }}
            ${{ steps.tags.outputs.ref_tag != '' && format('{0}:{1}', env.IMAGE_NAME, steps.tags.outputs.ref_tag) || '' }}
            ${{ steps.tags.outputs.ref_tag != '' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo "- \`${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.git_sha }}\`"
            if [[ -n "${{ steps.tags.outputs.ref_tag }}" ]]; then
              echo "- \`${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_tag }}\`"
              echo "- \`${{ env.IMAGE_NAME }}:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
